# Launcher icon generation (dart run flutter_launcher_icons).
#
# Sources of truth: tools/icon/*.svg (Inkscape, 108dp adaptive grid) — the
# render/ PNGs are committed build artifacts (see tools/icon/render.sh) so CI
# and machines without Inkscape can still regenerate via this tool.
#
# The foreground PNG is already composed on the 108dp grid with the art
# inside the 66dp safe zone (measured: bbox 23.2–84.8dp), so the tool's
# default 16% foreground inset must be turned OFF — with it the art would be
# shrunk twice.
flutter_launcher_icons:
  android: true
  image_path_android: "tools/icon/render/icon-512.png"
  min_sdk_android: 26 # project minSdk; adaptive icon XMLs are always valid here
  adaptive_icon_background: "tools/icon/render/background-512.png"
  adaptive_icon_foreground: "tools/icon/render/foreground-512.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "tools/icon/render/monochrome-512.png"
  ios: false # Android-only product (docs/PLAN.md); the iOS dir is template leftovers
  web:
    generate: true
    image_path: "tools/icon/render/icon-512.png"
    background_color: "#0F172A" # gradient bottom stop of the icon background
    theme_color: "#0284C7" # accentGrad bottom stop
