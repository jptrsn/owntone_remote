name: gates

on:
  pull_request:
  push:
    branches: [main]
    # release.sh pushes the annotated tag as its first remote action; without
    # this trigger the "CI cross-checks the tag" claim in release.sh is false
    # and a published artifact's toolchain is never cross-checked (PR #9 review).
    tags: ['v*']

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter test --exclude-tags live
      - run: flutter build apk --debug
